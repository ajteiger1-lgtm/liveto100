<!doctype html>
<html lang="en">
<head>
<title>Live to 100</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Live to 100">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0C0D0F">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column on a cloud-white ground. Flat white cards with hairline edges, one orange accent for actions. */
:root{
  --bg:#F3F4F6; --surface:#FFFFFF; --fill:#ECEEF1; --ink:#111214; --ink2:#666B74; --ink3:#A2A7AF;
  --line:rgba(17,18,20,.08); --accent:#FA5400; --accent-soft:rgba(250,84,0,.11); --on-accent:#FFFFFF; --good:#FA5400;
  --glass:rgba(243,244,246,.8);
  --sh-card:0 0 0 1px var(--line),0 1px 2px rgba(17,18,20,.06),0 18px 36px -14px rgba(17,18,20,.38);
  --sh-pop:0 1px 0 rgba(255,255,255,.8) inset,0 2px 4px rgba(17,18,20,.14),0 0 0 1px var(--line);
  --sh-key:0 1px 0 rgba(255,255,255,.75) inset,0 1px 2px rgba(17,18,20,.12),0 8px 14px -8px rgba(17,18,20,.32);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C0D0F; --surface:#17181B; --fill:#212226; --ink:#F4F5F7; --ink2:#9DA2AC; --ink3:#5E636C;
  --line:rgba(255,255,255,.08); --accent:#FF6A1A; --accent-soft:rgba(255,106,26,.16); --on-accent:#140800; --good:#FF6A1A;
  --glass:rgba(12,13,15,.78);
  --sh-card:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.4),0 20px 38px -14px rgba(0,0,0,.95);
  --sh-pop:0 1px 0 rgba(255,255,255,.1) inset,0 2px 4px rgba(0,0,0,.6),0 0 0 1px var(--line);
  --sh-key:0 1px 0 rgba(255,255,255,.08) inset,0 1px 2px rgba(0,0,0,.5),0 8px 14px -8px rgba(0,0,0,.8);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0D0F; --surface:#17181B; --fill:#212226; --ink:#F4F5F7; --ink2:#9DA2AC; --ink3:#5E636C;
  --line:rgba(255,255,255,.08); --accent:#FF6A1A; --accent-soft:rgba(255,106,26,.16); --on-accent:#140800; --good:#FF6A1A;
  --glass:rgba(12,13,15,.78);
  --sh-card:0 0 0 1px var(--line),0 1px 2px rgba(0,0,0,.4),0 20px 38px -14px rgba(0,0,0,.95);
  --sh-pop:0 1px 0 rgba(255,255,255,.1) inset,0 2px 4px rgba(0,0,0,.6),0 0 0 1px var(--line);
  --sh-key:0 1px 0 rgba(255,255,255,.08) inset,0 1px 2px rgba(0,0,0,.5),0 8px 14px -8px rgba(0,0,0,.8);
  color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px 110px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
a{color:var(--accent);text-decoration:none}
button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
[hidden]{display:none!important}
.tnum{font-variant-numeric:tabular-nums}

/* type */
.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.h-display{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.01em;line-height:.95;text-wrap:balance}
.h1{font-size:clamp(38px,11.5vw,50px)}
.h2{font-size:30px}
.h3{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.05;text-transform:uppercase;letter-spacing:.015em}
.muted{color:var(--ink2)}
.small{font-size:13px}

/* surfaces */
.card{background:var(--surface);border-radius:22px;box-shadow:var(--sh-card);padding:18px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.pill{padding:5px 11px;border-radius:999px;background:var(--fill);font-size:12.5px;font-weight:600;color:var(--ink2)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:16px;
  font-size:17px;font-weight:600;letter-spacing:.005em;transition:transform .12s ease,opacity .12s ease,background-color .12s ease}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--on-accent);width:100%;box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 2px 4px rgba(17,18,20,.14),0 14px 22px -10px rgba(250,84,0,.6)}
.btn.ghost{background:var(--fill);color:var(--ink);box-shadow:var(--sh-key)}
.btn.quiet{min-height:40px;font-size:15px;font-weight:500;color:var(--ink2);padding:0 12px;border-radius:12px}
.btn.sm{min-height:46px;font-size:16px;padding:0 18px;border-radius:14px}
.btn[disabled]{opacity:.35;pointer-events:none}
.dangerbtn{background:#D92D20;color:#fff}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--fill);color:var(--ink);flex:none;box-shadow:var(--sh-key)}
.iconbtn:active{transform:scale(.94)}

/* tab bar: one oval, a filled knob slides under the active label */
.tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;z-index:20;
  padding:14px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:linear-gradient(180deg,transparent,var(--bg) 42%)}
.tabs{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:100%;max-width:480px;background:var(--surface);border-radius:999px;padding:6px;box-shadow:var(--sh-card)}
.knob{position:absolute;top:6px;bottom:6px;left:6px;width:calc((100% - 12px) / 4);border-radius:999px;background:var(--ink);
  box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 10px 18px -8px rgba(0,0,0,.55);transition:transform .55s cubic-bezier(.3,1.3,.45,1)}
.knob.go{animation:squish .55s ease}
@keyframes squish{0%{scale:1 1}35%{scale:1.12 .93}100%{scale:1 1}}
.tabs[data-i="1"] .knob{transform:translateX(100%)}
.tabs[data-i="2"] .knob{transform:translateX(200%)}
.tabs[data-i="3"] .knob{transform:translateX(300%)}
.tab{position:relative;z-index:1;min-height:50px;border-radius:999px;font-family:var(--display);font-weight:600;font-size:16.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);transition:color .25s ease}
.tab[aria-selected="true"]{color:var(--bg)}

/* home */
.hello{display:flex;flex-direction:column;gap:12px;padding-top:14px}
.qt{margin:0;display:flex;flex-direction:column;gap:4px;max-width:36ch}
.qt blockquote{margin:0;font-size:18px;line-height:1.35;text-wrap:pretty}
.qt blockquote::before{content:"“"}.qt blockquote::after{content:"”"}
.qt figcaption{font-size:13px;color:var(--ink2);font-weight:500}
.qt figcaption::before{content:"— "}
.quote{font-size:15px;color:var(--ink2);max-width:36ch;text-wrap:pretty;margin:0}
.phase{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--fill);font-size:12.5px;font-weight:600;color:var(--ink2)}
.phase i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:block}
.streak{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--fill);font-size:12.5px;font-weight:500;color:var(--ink2)}
.streak b{font-weight:700;color:var(--ink)}
.streak.on{background:var(--accent-soft);color:var(--accent)}
.streak.on b{color:var(--accent)}
.hero{display:flex;flex-direction:column;gap:14px;padding:22px}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap}
.preview{display:flex;flex-direction:column;margin:0;padding:0}
.preview li{list-style:none;display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:15px}
.preview li span:last-child{color:var(--ink2);white-space:nowrap;font-size:14px}
.preview li.grp{padding:16px 0 6px;border-top:0;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.preview li.grp span:last-child{display:none}
.preview li.grp:first-child{padding-top:2px}

/* lists */
.list{display:flex;flex-direction:column;gap:10px}
.daycard{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:16px 18px}
.daytag{font-family:var(--display);font-weight:700;font-size:20px;width:44px;color:var(--ink2);letter-spacing:.04em;text-transform:uppercase}
.daycard.isdone{background:linear-gradient(0deg,var(--accent-soft),var(--accent-soft)),var(--surface)}
.daycard.isdone .h3,.daycard.isdone .daytag{color:var(--ink2)}
.donemark{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.donemark svg{width:17px;height:17px}
.acc{color:var(--accent)}
.card summary{list-style:none;cursor:pointer}
.card summary::-webkit-details-marker{display:none}
.hist-body{display:flex;flex-direction:column;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);font-size:14px}
.hist-body .ex{display:flex;justify-content:space-between;gap:10px}
.hist-body .ex span:last-child{color:var(--ink2);text-align:right}
.empty{text-align:center;color:var(--ink2);padding:36px 20px}
</style>
</head>
<body>
<style>
/* workout: sticky glass header, segmented controls, flat set rows, quiet steppers */
.wtop{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));
  padding:8px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));
  background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 1px 0 var(--line)}
.wtop-in{max-width:480px;margin:0 auto;display:flex;align-items:center;gap:12px}
.timer{font-family:var(--display);font-weight:600;font-size:30px;letter-spacing:.02em;line-height:1}
.bar{height:4px;border-radius:99px;background:var(--fill);overflow:hidden;flex:1}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s ease}
.seg{display:flex;gap:2px;background:var(--fill);border-radius:12px;padding:3px}
.seg button{flex:1;min-height:36px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink2);transition:background-color .15s ease}
.seg button[aria-selected="true"]{background:var(--surface);box-shadow:var(--sh-pop);color:var(--ink)}
.section-label{display:flex;align-items:baseline;justify-content:space-between;padding:6px 4px 0}

.ex{display:flex;flex-direction:column;gap:14px}
.ex-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.rx{font-family:var(--display);font-weight:600;font-size:20px;color:var(--accent);white-space:nowrap;line-height:1.05;text-align:right}
.rx small{font-size:12.5px;font-family:var(--body);font-weight:500;color:var(--ink2)}
.how{font-size:14px;color:var(--ink2);line-height:1.5}
.how p{margin:0 0 8px}
.how summary{cursor:pointer;font-weight:600;color:var(--ink);list-style:none;padding:4px 0;min-height:30px;font-size:14px}
.how summary::-webkit-details-marker{display:none}
.how summary::after{content:" +";color:var(--accent)}
.how[open] summary::after{content:" −"}
.seeit{font-weight:600;font-size:14px}
.last{font-size:13px;color:var(--ink2);background:var(--fill);border-radius:12px;padding:10px 12px;line-height:1.45}
.last b{color:var(--ink);font-weight:600}

.sets{display:flex;flex-direction:column;gap:6px}
.setdone,.setwait{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;background:var(--fill);font-size:15px;min-height:46px}
.setdone .n,.setwait .n{font-family:var(--display);font-weight:600;font-size:18px;width:20px;color:var(--ink3)}
.setdone .tick{margin-left:auto;color:var(--accent);display:grid}
.setdone .tick svg{width:18px;height:18px}
.setdone .rirtag{color:var(--ink2);font-size:13px;margin-left:auto}
.setdone .rirtag+.tick{margin-left:0}
.setwait{background:transparent;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink3)}
.setact{display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:18px;background:var(--surface);box-shadow:0 0 0 1.5px var(--accent),0 12px 24px -18px rgba(250,84,0,.5)}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stp{display:flex;flex-direction:column;gap:6px;min-width:0}
.stp .lab,.rir .lab{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);text-align:center}
.stp .ctl{display:flex;align-items:center;justify-content:space-between;gap:4px}
.rbtn{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:24px;line-height:1;font-weight:500;
  background:var(--accent-soft);color:var(--accent);touch-action:manipulation;user-select:none;transition:transform .1s ease}
.rbtn:active{transform:scale(.92)}
.val{flex:1;min-width:0;width:100%;text-align:center;font-family:var(--display);font-weight:600;font-size:36px;line-height:1;background:transparent;border:0;color:var(--ink);padding:0;-moz-appearance:textfield;transition:color .15s ease}
.val.rec{color:var(--ink3)}
.val::-webkit-outer-spin-button,.val::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.val:focus{outline:none;box-shadow:0 2px 0 var(--accent)}
.rir{display:flex;flex-direction:column;gap:6px}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:var(--fill);border-radius:12px;padding:3px}
.chip{min-height:38px;border-radius:9px;font-family:var(--display);font-weight:600;font-size:19px;color:var(--ink2);transition:background-color .15s ease}
.chip[aria-pressed="true"]{background:var(--surface);box-shadow:var(--sh-pop);color:var(--ink)}
.donebanner{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:14px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:15px}
.donebanner svg{width:18px;height:18px}
.check{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:14px;background:var(--fill);min-height:50px}
.box{width:24px;height:24px;border-radius:8px;flex:none;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;color:transparent}
.box svg{width:15px;height:15px}
.check[aria-pressed="true"] .box{background:var(--accent);color:var(--on-accent);box-shadow:none}
.check[aria-pressed="true"] .t{color:var(--ink3)}
.check .d{margin-left:auto;font-size:13px;color:var(--ink2);white-space:nowrap}
.check .t{font-size:16px;font-weight:500}
.noteinput{width:100%;border:0;border-radius:12px;padding:12px 14px;background:var(--fill);color:var(--ink);font:inherit;font-size:15px}
.noteinput::placeholder{color:var(--ink3)}

.stack{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.stack li{display:flex;flex-direction:column;gap:3px;padding:12px 0;border-top:1px solid var(--line)}
.stack li:first-child{border-top:0;padding-top:2px}
.stack .top{display:flex;justify-content:space-between;gap:12px;font-weight:500;font-size:16px}
.stack .top span:last-child{color:var(--ink2);white-space:nowrap;font-weight:500;font-size:14px}
.stack .cue{font-size:13px;color:var(--ink2);line-height:1.4}
.stack.compact li{padding:8px 0;gap:0}
.stack.compact .top{font-size:15px}
.navrow{display:flex;gap:10px}
.navrow .btn.prev{flex:0 0 104px}
.navrow .btn:not(.prev){flex:1}
.fullrow{display:flex;flex-direction:column;gap:12px;padding:16px}
.fullrow.now{box-shadow:0 0 0 1.5px var(--accent)}
.sets-list{list-style:none;margin:0;padding:0}
.sets-list li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.sets-list li:first-child{border-top:0}
.sets-list .plan{color:var(--ink3)}
.sets-list .logged span:last-child i{font-style:normal;color:var(--ink2);font-size:13px;margin-left:6px}
.logline{font-size:14px;color:var(--ink2);line-height:1.45}

/* sheet, summary, toast */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.42);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:480px;max-height:88%;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:14px 16px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);background:rgba(120,125,135,.35);align-self:center}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat div{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 6px;border-radius:16px;background:var(--fill)}
.stat b{font-family:var(--display);font-size:30px;font-weight:600;line-height:1}
.stat span{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;max-width:88%;text-align:center}
.syncnote{font-size:12px;color:var(--ink3);text-align:center}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* stronger tactile touches */
.rbtn{box-shadow:0 8px 14px -8px rgba(250,84,0,.55),0 1px 0 rgba(255,255,255,.4) inset}
.setdone,.check{box-shadow:var(--sh-key)}
.val{min-height:46px}

/* history calendar */
.cal-head,.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-head{margin-bottom:6px}
.cal-head span{text-align:center;font-size:11px;font-weight:600;letter-spacing:.1em;color:var(--ink3)}
.cal-day{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--ink);transition:transform .1s ease}
.cal-day:active{transform:scale(.92)}
.cal-day.today{box-shadow:inset 0 0 0 1.5px var(--ink3)}
.cal-day.has{box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent);font-weight:600}
.cal-day.full{background:var(--accent);color:var(--on-accent);box-shadow:0 8px 14px -8px rgba(250,84,0,.6)}
.cal-day.sel{outline:2px solid var(--ink);outline-offset:2px}

/* rating */
.rateblock{display:flex;flex-direction:column;gap:8px}
.rate{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;background:var(--fill);border-radius:12px;padding:3px}
.rn{min-height:38px;border-radius:9px;font-family:var(--display);font-weight:600;font-size:17px;color:var(--ink2)}
.rn[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:var(--sh-pop)}
.drop{background:var(--fill);border-radius:14px;padding:0 14px}
.drop summary{display:flex;justify-content:space-between;align-items:center;min-height:48px;font-weight:600;font-size:15px;cursor:pointer;list-style:none}
.drop summary::-webkit-details-marker{display:none}
.drop summary::after{content:"+";color:var(--accent);font-size:20px;margin-left:10px}
.drop[open] summary::after{content:"−"}
.drop .cnt{margin-left:auto;color:var(--accent);font-variant-numeric:tabular-nums}
.cloud{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 14px}
.mv{padding:8px 12px;border-radius:999px;background:var(--surface);box-shadow:var(--sh-key);font-size:14px;font-weight:500;color:var(--ink2)}
.mv[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:none}
</style>
<style>
/* notes, supersets, left/right, strength chart */

const EPOCH = 'e2';

/* ---------- CORE: state, dates, persistence ---------- */
const S = { tab: 'today', sessions: {}, activeId: null, draft: {}, editing: null, sheet: null, cloud: 'pending', mode: 'focus', editStep: null, preview: null, histDay: null, histMonth: null, rateOpen: null, delAsk: null };

const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const dayDiff = (a, b) => Math.round((a - b) / 86400000);

function progress() {
  const now = new Date();

  const d = dayDiff(t0, parseKey(START));
  if (d < 0) return { pre: true, week: 1, beyond: false, dayIndex: d, today: t0 };

  return { pre: false, week: Math.min(wk, 4), beyond: wk > 4, dayIndex: d, today: t0 };
}

  const p = progress();

  if (ov && ov.date === dateKey(p.today) && SESSIONS[ov.key]) return ov.key;

const roundTo = (v, step) => Math.round(v / step) * step;
/* left/right: a "per side" move stores the left side in w/r and the right side in w2/r2 */
const isSided = ex => /per side/.test((ex && ex.unit) || '');
const sidesOf = (ex, st) => (isSided(ex) && st && st.r2 != null) ? [{ w: st.w || 0, r: st.r || 0 }, { w: st.w2 || 0, r: st.r2 || 0 }] : [{ w: (st && st.w) || 0, r: (st && st.r) || 0 }];

  if (isSided(ex) && st.r2 != null) return (st.w || 0) === (st.w2 || 0) ? f(st.w, st.r, 'L') + ' ' + 'R' + st.r2 : 'L ' + f(st.w, st.r) + ' · R ' + f(st.w2, st.r2);

}

}

}
/* smart starting suggestion for a lift, from what you did last time */
function recommend(ex, week, exceptId) {
  if (ex.kind !== 'lift') return null;
  const hasW = showW(ex), last = lastFor(ex.id, exceptId);
  let w = hasW ? (ex.start || 0) : 0, why = hasW && ex.start ? 'Starting guess' : '';
  const sets = last && last.e.sets ? last.e.sets.filter(Boolean) : [];
  if (sets.length) {
    const all = sets.flatMap(x => sidesOf(ex, x));
    const topW = Math.max(...all.map(x => x.w || 0));
    const minRir = Math.min(...sets.map(x => x.rir == null ? 2 : x.rir));
    const hit = all.every(x => (x.r || 0) >= ex.reps);
    w = topW; why = 'Matching last time';
    if (hasW && hit && minRir >= 2 && sets.length >= 2) { w = topW + ex.step; why = 'Last time felt easy'; }
    else if (hasW && minRir === 0 && !hit) { w = Math.max(0, topW - ex.step); why = 'Last time was at your limit'; }
  }
  if (hasW && WEEKS[week] && WEEKS[week].deload) { w = Math.max(0, roundTo(w * 0.85, ex.step)); why = 'Deload week'; }
  if (hasW && ex.cap && w > ex.cap) w = ex.cap;
  return { w, r: ex.reps, why };
}
function rxText(ex, week) {

    if (showW(ex) && r && r.w) t += ` · ${r.w} lb`;
    return t;
  }

}

  return (WEEKS[week].deload && base > 2) ? Math.max(2, Math.ceil(base / 2)) : base;

}

  for (const s of sortedSessions()) {

document.addEventListener('click', e => {
  const ro = e.target.closest('summary[data-ro]');
  if (ro) { S.rateOpen = ro.parentElement.open ? null : ro.dataset.ro; return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, s = S.activeId ? S.sessions[S.activeId] : null, ex = el.dataset.ex;
  if (act === 'closesheet' && e.target !== el) return;
  switch (act) {
    case 'start': startWorkout(); return;
    case 'swap': S.sheet = 'swap'; render(); return;
    case 'closesheet': S.sheet = null; render(); return;
    case 'pick': {
      const p = progress(); lsSet('ss.override', { date: dateKey(p.today), key: el.dataset.key });
      S.sheet = null; S.preview = null; S.tab = 'today'; render(); toast('Today is now ' + SESSIONS[el.dataset.key].name); top0(); return;
    }
    case 'preview': S.preview = el.dataset.key; render(); top0(); return;
    case 'closepreview': S.preview = null; render(); top0(); return;
    case 'startpreview': startWorkout(el.dataset.key); return;
    case 'delask': S.delAsk = el.dataset.id; render(); return;
    case 'delcancel': S.delAsk = null; render(); return;
    case 'delconfirm': deleteSession(el.dataset.id); S.delAsk = null; render(); toast('Workout deleted'); return;
    case 'back': if (s) { pauseSession(s); save(s); } S.activeId = null; unlockScreen(); render(); return;
    case 'mode': S.mode = el.dataset.m; S.editStep = null; S.editing = null; S.scrollCur = S.mode === 'full'; render(); if (S.mode !== 'full') top0(); return;
    case 'goto': {
      if (!s) return; const i = parseInt(el.dataset.i, 10), how = el.dataset.how;
      if (how === 'edit') S.editStep = i; else { S.editStep = null; if (how === 'go') { moveTo(s, i); save(s); } }
      S.mode = 'focus'; S.editing = null; render(); top0(); return;
    }
    case 'backtoworkout': S.editStep = null; S.editing = null; render(); top0(); return;
    case 'prev': if (s) { moveTo(s, Math.max(0, (s.step || 0) - 1)); save(s); S.editing = null; render(); top0(); } return;
    case 'next': if (s) { advance(s); save(s); S.editing = null; render(); top0(); } return;
    case 'donestack': if (s) { const st0 = stepFor(s, el.dataset.k) || stepsOf(SESSIONS[s.key]).find(x => x.id === el.dataset.k), was = stepDone(s, st0); s.checks[el.dataset.k] = true; settle(s); const mv = maybeAdvance(s, st0, was); save(s); render(); if (mv) top0(); } return;
    case 'donecheck': if (s) { const st = stepsOf(SESSIONS[s.key])[s.step || 0], was = st ? stepDone(s, st) : true; if (st && st.type === 'ex') st.ex.checks.forEach((_, i) => { s.checks[st.ex.id + ':' + i] = true; }); settle(s); const mv = maybeAdvance(s, st, was); save(s); render(); if (mv) top0(); } return;
    case 'toggle': if (s) { s.checks[el.dataset.k] = !s.checks[el.dataset.k]; save(s); render(); } return;
    case 'step': {
      const d = S.draft[ex]; if (!d) return; const f = el.dataset.f, inc = parseFloat(el.dataset.d);
      d[f] = Math.max(0, Math.round(((d[f] || 0) + inc) * 100) / 100); if (d.g) d.g[f] = false;
      showField(ex, f, d); mirrorSide(ex, d, f);
      return;
    }
    case 'rir': {
      const d = S.draft[ex]; if (!d) return; d.rir = parseInt(el.dataset.v, 10);
      el.parentElement.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c === el))); return;
    }
    case 'log': {
      const d = S.draft[ex]; if (!s || !d) return; const exo = findEx(ex), st0 = stepFor(s, ex), was = st0 ? stepDone(s, st0) : true, en = entry(s, ex); en.sets = en.sets || [];
      const rec = { w: d.w || 0, r: d.r || 0, rir: d.rir, t: Date.now() };
      if (isSided(exo)) { rec.w2 = d.w2 || 0; rec.r2 = d.r2 || 0; }
      const note = (d.note || '').trim(); if (note) rec.note = note;
      en.sets[d.i] = rec;
      S.editing = null; delete S.draft[ex]; settle(s); const mv = maybeAdvance(s, st0, was); save(s); render(); if (mv) top0(); return;
    }
    case 'delset': if (s) {
      const en = entry(s, ex), i = parseInt(el.dataset.i, 10); en.sets = en.sets || [];
      if (i < en.sets.length) en.sets.splice(i, 1);
      en.extra = Math.max(0, (en.extra || 0) - 1); S.editing = null; delete S.draft[ex]; settle(s); save(s); render(); toast('Extra set removed');
    } return;
    case 'edit': S.editing = { ex, i: parseInt(el.dataset.i, 10) }; delete S.draft[ex]; render(); return;
    case 'closeedit': S.editing = null; delete S.draft[ex]; render(); return;
    case 'addset': if (s) { const en = entry(s, ex), stx = stepFor(s, ex); en.extra = (en.extra || 0) + 1; en.sets = en.sets || []; bank(s); (s.open = s.open || {})[stx ? stx.id : ex] = true; runClock(s); S.editing = null; save(s); render(); } return;
    case 'ecardio': S.editing = { ex, i: 'c' }; delete S.draft[ex]; render(); return;
    case 'logcardio': {
      const d = S.draft[ex]; if (!s || !d) return;
      const st0 = stepFor(s, ex), was = st0 ? stepDone(s, st0) : true;
      s.entries[ex] = { min: d.min || 0, dist: d.dist || 0, note: (d.note || '').trim() };
      S.editing = null; delete S.draft[ex]; settle(s); const mv = maybeAdvance(s, st0, was); save(s); render(); if (mv) top0(); return;
    }
    case 'finish': {
      if (!s) return; S.editStep = null; pauseSession(s); s.done = true; s.durationSec = Math.round(s.accSec || 0); save(s);
      S.sheet = 'summary'; S.rateOpen = null; unlockScreen(); stopTick(); top0(); render(); confetti(); return;
    }
    case 'hmonth': {
      const hm = S.histMonth || { y: new Date().getFullYear(), m: new Date().getMonth() }, d = new Date(hm.y, hm.m + parseInt(el.dataset.d, 10), 1);
      S.histMonth = { y: d.getFullYear(), m: d.getMonth() }; S.histDay = null; S.delAsk = null; render(); return;
    }
    case 'calday': S.histDay = S.histDay === el.dataset.date ? null : el.dataset.date; S.delAsk = null; render(); return;
    case 'effort': if (s) { const v = parseInt(el.dataset.v, 10); s.effort = s.effort === v ? null : v; save(s); render(); } return;
    case 'recov': if (s) { const v = parseInt(el.dataset.v, 10); s.recov = s.recov === v ? null : v; save(s); render(); } return;
    case 'strex': S.strEx = ex; render(); top0(); return;
    case 'strback': S.strEx = null; render(); top0(); return;
    case 'strreps': S.strReps = parseInt(el.dataset.n, 10); render(); return;
    case 'export': exportBackup(); return;
    case 'rate': if (s) { const v = parseInt(el.dataset.v, 10); s.rating = s.rating === v ? null : v; save(s); render(); } return;
    case 'mark': if (s) {
      const w = el.dataset.w, o = w === 'loved' ? 'meh' : 'loved', id = el.dataset.id;
      s[o] = (s[o] || []).filter(x => x !== id);
      s[w] = (s[w] || []).includes(id) ? s[w].filter(x => x !== id) : (s[w] || []).concat(id);
      save(s); render();
    } return;
    case 'closesummary': S.sheet = null; S.activeId = null; S.tab = 'today'; top0(); render(); return;
  }
});

document.addEventListener('input', e => {
  const t = e.target; if (!t.dataset || !t.dataset.ex || !t.dataset.f) return;
  const d = S.draft[t.dataset.ex]; if (!d) return;
  d[t.dataset.f] = t.dataset.f === 'note' ? t.value : num(t.value);
  if (d.g) d.g[t.dataset.f] = false; t.classList.remove('rec');
  mirrorSide(t.dataset.ex, d, t.dataset.f);
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('val')) e.target.blur(); });
document.addEventListener('focusin', e => { if (e.target.classList && e.target.classList.contains('val')) setTimeout(() => { try { e.target.select(); } catch (x) {} }, 0); });
document.addEventListener('visibilitychange', () => { if (S.activeId) lockScreen(); });
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  const k = $('.knob'); if (k && S.tab !== t.dataset.tab) { k.classList.remove('go'); void k.offsetWidth; k.classList.add('go'); }
  S.tab = t.dataset.tab; S.sheet = null; S.preview = null; S.histDay = null; top0(); render();
}));

/* boot: show saved data instantly, then connect cloud sync */
migrateStorage();
S.sessions = lsGet('ss.sessions', {});
Object.values(S.sessions).forEach(upgradeSession);
render();
initCloud();
/* ---------- standalone app: backup, restore, offline ---------- */
async function exportBackup() {
  const data = JSON.stringify({ app: 'live-to-100', schema: SCHEMA, exported: new Date().toISOString(), sessions: S.sessions }, null, 1);
  const name = 'live-to-100-backup-' + dateKey(new Date()) + '.json';
  try {
    const f = new File([data], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: 'Live to 100 backup' }); lsSet('ss.lastBackup', Date.now()); render(); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' })); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); lsSet('ss.lastBackup', Date.now()); toast('Backup saved'); render();
  } catch (e) { toast('Could not export'); }
}
document.addEventListener('change', e => {
  if (!e.target || e.target.id !== 'importfile') return;
  const file = e.target.files && e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result), src = d.sessions || {}; let n = 0;
      Object.values(src).forEach(s => { if (!s || !s.id) return; const l = S.sessions[s.id]; if (!l || (s.updatedAt || 0) > (l.updatedAt || 0)) { s.ep = EPOCH; S.sessions[s.id] = upgradeSession(s); n++; } });
      persistLocal(); render(); toast(n + ' workout' + (n === 1 ? '' : 's') + ' imported');
    } catch (err) { toast('That file did not work'); }
  };
  r.readAsText(file);
});
if ('serviceWorker' in navigator) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });

/* ask the browser to keep this site's data even when the phone is low on space */
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

</script>
